<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafd">
  <meta name="description" content="Reality Diff reconstructs how the physical world changed from ordinary photo history.">
  <title>Reality Diff · Semantic memory for the physical world</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <svg class="svg-defs" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-reality" viewBox="0 0 24 24"><path d="M4 5.5 12 2l8 3.5v13L12 22l-8-3.5zM12 2v20M4 5.5l8 3.7 8-3.7"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></symbol>
    <symbol id="i-gallery" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 3.5 3.5 2-2L20 19"/></symbol>
    <symbol id="i-timeline" viewBox="0 0 24 24"><path d="M6 3v18M6 7h9l3 3-3 3H6M6 16h7"/><circle cx="6" cy="7" r="2"/><circle cx="6" cy="16" r="2"/></symbol>
    <symbol id="i-ask" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H6l-4 2 1.4-4.2A9 9 0 1 1 21 12Z"/><path d="M8.5 10a3.5 3.5 0 1 1 5.5 2.8c-1.2.8-2 1.3-2 2.7M12 18h.01"/></symbol>
    <symbol id="i-source" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.5 5.5L19 9l-5.5 1.5L12 16l-1.5-5.5L5 9l5.5-1.5zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h4l1.5-2h5L16 7h4a1 1 0 0 1 1 1v11H3V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.2 8 11 4.6-1.8 8-6 8-11V5z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  </svg>

  <div class="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="/#home" aria-label="Reality Diff home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span><strong>Reality Diff</strong><small>with Gemini</small></span>
      </a>

      <nav class="nav-list">
        <a href="/#home" data-route="home"><svg><use href="#i-home"/></svg><span>Home</span></a>
        <a href="/#gallery" data-route="gallery"><svg><use href="#i-gallery"/></svg><span>Photos</span></a>
        <a href="/#reality" data-route="reality"><svg><use href="#i-reality"/></svg><span>Reality</span><b id="nav-subject-count">4</b></a>
        <a href="/#use-cases" data-route="use-cases"><svg><use href="#i-grid"/></svg><span>Use cases</span></a>
        <a href="/#timeline" data-route="timeline"><svg><use href="#i-timeline"/></svg><span>Timeline</span></a>
        <a href="/#ask" data-route="ask"><svg><use href="#i-ask"/></svg><span>Ask</span></a>
        <a href="/#sources" data-route="sources"><svg><use href="#i-source"/></svg><span>Sources</span></a>
      </nav>

      <div class="sidebar-bottom">
        <div class="sync-card">
          <div class="sync-orbit"><i></i></div>
          <div><strong>World is current</strong><span id="sync-label">Loading…</span></div>
        </div>
        <a class="profile" href="/#memory" data-route="memory">
          <span class="avatar">M</span><span><strong>Maya's world</strong><small>Personal · private</small></span>
          <svg><use href="#i-chevron"/></svg>
        </a>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark"><span></span><span></span><span></span><span></span></span><strong>Reality Diff</strong></div>
        <button class="search-trigger" type="button" data-action="open-search">
          <svg><use href="#i-search"/></svg><span>Search your physical history</span><kbd>⌘ K</kbd>
        </button>
        <div class="top-actions">
          <span class="demo-pill" id="runtime-pill"><i></i><span id="runtime-label">Loading runtime</span></span>
          <button class="icon-button" type="button" data-action="open-info" aria-label="About this demo"><svg><use href="#i-info"/></svg></button>
          <button class="primary-button compact" type="button" data-action="add-photos"><svg><use href="#i-plus"/></svg>Add photos</button>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <div class="page-loading" role="status"><span class="loading-mark"></span><p>Reconstructing the demo world…</p></div>
      </main>
    </section>
  </div>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="/#gallery" data-route="gallery"><svg><use href="#i-gallery"/></svg><span>Photos</span></a>
    <a href="/#reality" data-route="reality"><svg><use href="#i-reality"/></svg><span>Reality</span></a>
    <a href="/#use-cases" data-route="use-cases"><svg><use href="#i-grid"/></svg><span>Use cases</span></a>
    <a href="/#ask" data-route="ask"><svg><use href="#i-ask"/></svg><span>Ask</span></a>
    <a href="/#sources" data-route="sources"><svg><use href="#i-source"/></svg><span>Sources</span></a>
  </nav>

  <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">Reality Diff needs JavaScript to explore the interactive demo.</div></noscript>
  <script src="/app.js" defer></script>
</body>
</html>
