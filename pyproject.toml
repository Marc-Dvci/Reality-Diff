[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-diff"
version = "0.1.0"
description = "A semantic memory for the physical world"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
]

[project.optional-dependencies]
google = [
  "google-adk>=2.6,<3",
  "google-genai>=2.9,<3",
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-storage>=3.0,<4",
  "google-cloud-pubsub>=2.27,<3",
]
dev = [
  "httpx2>=2.9,<3",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
