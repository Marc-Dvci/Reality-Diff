name: Reality Diff CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check src tests
      - run: node --check web/app.js
      - run: python -m json.tool web/fixtures/demo.json > /dev/null

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.1.0"
      - run: ./gradlew clean assembleDebug lintDebug
        working-directory: android
